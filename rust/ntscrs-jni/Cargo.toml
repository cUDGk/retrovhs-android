[package]
name = "ntscrs-jni"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "ntscrs_jni"

[dependencies]
jni = { version = "0.21", default-features = false }
ntsc-rs = { git = "https://github.com/ntsc-rs/ntsc-rs.git", branch = "main" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
